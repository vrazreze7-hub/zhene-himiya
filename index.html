<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
:root{
  color-scheme:light;
  --plane:#f4f1ea; --card:#fffcf7; --card-2:#efe8dc;
  --ink:#1c1916; --ink-2:#5c564e; --muted:#8a8278;
  --hairline:#e4d9c8; --border:rgba(60,40,20,.10); --border-2:rgba(60,40,20,.05);
  --accent:#0d6e56; --accent-2:#c45c26; --accent-soft:rgba(13,110,86,.12);
  --good:#2a7a3a; --good-soft:rgba(42,122,58,.12);
  --crit:#b42318; --crit-soft:rgba(180,35,24,.10);
  --warn:#9a6b12; --warn-soft:rgba(154,107,18,.14);
  --shadow:0 1px 2px rgba(40,24,8,.04),0 10px 28px rgba(40,24,8,.06);
  --radius:20px;
  --sidebar:292px;
}
#theme-toggle:checked ~ .app{
  color-scheme:dark;
  --plane:#12110f; --card:#1c1b18; --card-2:#26241f;
  --ink:#f3eee6; --ink-2:#b7b0a4; --muted:#8e877c;
  --hairline:#3a372f; --border:rgba(255,240,220,.10); --border-2:rgba(255,240,220,.05);
  --accent:#4ec9a6; --accent-2:#e08956; --accent-soft:rgba(78,201,166,.16);
  --good:#62c472; --good-soft:rgba(98,196,114,.14);
  --crit:#f07167; --crit-soft:rgba(240,113,103,.14);
  --warn:#e0b45a; --warn-soft:rgba(224,180,90,.14);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--plane);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.theme-cb{position:absolute;opacity:0;pointer-events:none}
.app{min-height:100vh;background:var(--plane);color:var(--ink);display:flex}
.sidebar{
  width:var(--sidebar);flex:none;position:sticky;top:0;height:100vh;overflow:auto;
  background:var(--card);border-right:1px solid var(--border);padding:22px 16px 40px;
}
.brand{padding:4px 8px 16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{margin:6px 0 0;font-size:20px;letter-spacing:-.02em}
.brand p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.nav-sec{margin:16px 0 6px;padding:0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-btn{
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer;font-size:13.5px;
}
.nav-btn:hover{background:var(--card-2)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-btn .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:var(--hairline)}
.nav-btn.done .dot{background:var(--good)}
.nav-btn.active .dot{background:var(--accent)}
.main{flex:1;min-width:0;padding:28px 28px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.icon-btn{
  border:1px solid var(--border);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer;font-size:14px;
}
.wrap{max-width:820px}
.hero,.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:16px;
}
.hero h2{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}
.lead{color:var(--ink-2);font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{font-size:12px;background:var(--card-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--ink-2)}
h3{margin:0 0 10px;font-size:18px;letter-spacing:-.02em}
h4{margin:16px 0 8px;font-size:15px}
p{margin:0 0 10px}
ul,ol{margin:0 0 12px;padding-left:1.2em}
li{margin:0 0 6px}
.def{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;
}
.def b{color:var(--accent)}
.ex{
  background:var(--card-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:12px 0;
}
.tip{
  background:var(--warn-soft);border:1px solid rgba(154,107,18,.2);border-radius:14px;padding:12px 14px;margin:12px 0;
}
.task,.q{
  border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:10px 0;background:var(--card);
}
.task-head,.q-head{font-weight:650;margin-bottom:8px}
.reveal{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--hairline);color:var(--ink-2)}
.task.open .reveal,.q.checked .reveal{display:block}
.btn{
  border:0;background:var(--ink);color:var(--plane);border-radius:12px;padding:8px 14px;
  font:inherit;font-weight:650;cursor:pointer;font-size:13.5px;
}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn.good{background:var(--good)}
.options{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;
  padding:8px 10px;cursor:pointer;background:var(--card-2);
}
.opt input{margin-top:3px}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.score{font-weight:700;margin-top:8px}
.prog-bar{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden;margin:10px 0 0}
.prog-bar>i{display:block;height:100%;background:var(--accent);width:0;border-radius:99px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.el{
  border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--card-2);cursor:pointer;min-height:86px;
}
.el b{display:block;font-size:20px;letter-spacing:-.03em}
.el span{display:block;font-size:11px;color:var(--ink-2)}
.el.metal{border-color:rgba(196,92,38,.35)}
.el.nonmetal{border-color:rgba(13,110,86,.35)}
.el.noble{border-color:rgba(90,90,160,.35)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:20;padding:20px}
.modal-bg.show{display:grid}
.modal{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:22px;border:1px solid var(--border)}
.hidden{display:none}
.menu-btn{display:none}
.done-mark{color:var(--good);font-size:13px;font-weight:700}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);z-index:15;transition:.2s}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:18px 16px 72px}
  .grid-2{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}
.katex{font-size:1.05em}

.ans-in{width:160px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--card-2);color:var(--ink)}
.note-src{font-size:12.5px;color:var(--ink-2)}

</style>
</head>
<body>
<input type="checkbox" id="theme-toggle" class="theme-cb">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="topbar">
    <button class="icon-btn menu-btn" type="button" id="menu">меню</button>
    <div class="eyebrow">курс · с нуля · в своём темпе</div>
    <label class="icon-btn" for="theme-toggle">тема</label>
  </div>
  <div class="wrap" id="view"></div>
</main>
</div>
<div class="modal-bg" id="modal"></div>

const GLOSSARY = [
  ["Атом","Наименьшая частица элемента, сохраняющая его химические свойства."],
  ["Молекула","Частица из двух и более атомов, соединённых химической связью."],
  ["Элемент","Вид атомов с одинаковым числом протонов (одинаковым номером)."],
  ["Вещество","То, из чего состоят тела. Имеет состав и свойства."],
  ["Смесь","Сочетание нескольких веществ, которые можно разделить физически."],
  ["Чистая вещество","Состоит из частиц одного вида. Имеет постоянный состав."],
  ["Физическое явление","Меняется форма, размер, агрегатное состояние. Состав вещества тот же."],
  ["Химическое явление / реакция","Одни вещества превращаются в другие."],
  ["Оксид","Соединение элемента с кислородом. Пример: H₂O, CO₂, Fe₂O₃."],
  ["Кислота","Вещество, которое в воде даёт ионы водорода H⁺. На вкус кислое, осторожно."],
  ["Основание / щёлочь","Вещество, которое в воде даёт ионы OH⁻. Мылкое на ощупь, осторожно."],
  ["Соль","Продукт замены водорода кислоты на металл. Пример: NaCl."],
  ["pH","Шкала кислотности. 7 — нейтрально, меньше 7 — кислотно, больше — щелочно."],
  ["Раствор","Однородная смесь. Частицы растворённого вещества распределены равномерно."],
  ["Концентрация","Сколько растворённого вещества в определённом количестве раствора."],
  ["Валентность","Число связей, которое атом обычно образует."],
  ["Ион","Атом или группа атомов с зарядом. Потерял электрон — плюс, принял — минус."],
  ["Катализатор","Вещество, ускоряющее реакцию и при этом не расходующееся."],
  ["Закон сохранения массы","Масса веществ до реакции равна массе веществ после."],
  ["Период","Горизонтальный ряд таблицы Менделеева."],
  ["Группа","Вертикальный столбец таблицы. У элементов группы похожие свойства."]
];

const PAGES = [];

function page(id, nav, title, html, quiz){

}

page("home","Старт","Химия с нуля", `
  <section class="hero">
    <div class="eyebrow">для Жени</div>
    <h2>Химия как язык мира, а не школьный кошмар</h2>
    <p class="lead">Курс с нуля. Без спешки, без «ты должна». Можно открыть на кухне на 20 минут и закрыть. Всё нужное — на этой странице: объяснения, определения, примеры из быта, задания и тесты с мгновенной проверкой.</p>

    <h3>Как устроен курс</h3>
    <ol>
      <li><b>Модуль</b> — большой кусок картины (атом, реакции, кислоты…).</li>
      <li><b>Тема</b> — 15–25 минут чтения и 5–10 минут заданий.</li>

  </section>
  <section class="card">
    <h3>Правила дома</h3>
    <ul>
      <li>Никаких опытов с бытовой химией «смешать и посмотреть», если это не написано как безопасное наблюдение.</li>
      <li>Отбеливатель и кислотные средства не встречаются. Это не шутка.</li>
      <li>Еда и реактивы в голове разделяем: сода на кухне — еда, сода в рассуждении — вещество.</li>
      <li>Если кружится голова от объёма — закройте вкладку. Курс никуда не денется.</li>

  </section>
  <section class="card">
    <h3>Карта</h3>
    <ol>
      <li>Мир веществ — научиться видеть вещество, смесь и превращение.</li>
      <li>Атом и таблица — азбука.</li>
      <li>Формулы и связи — почему атомы держатся вместе.</li>
      <li>Реакции — как записывать превращения.</li>
      <li>Вода и растворы — почти вся жизнь здесь.</li>
      <li>Кислоты, щёлочи, соли — кухня, уборка, тело.</li>
      <li>Химия вокруг и первый шаг в органику.</li>
    </ol>
    <p>Когда карта перестанет быть страшной, химия перестаёт быть предметом и становится способом смотреть.</p>
  </section>
`);

page("how","Как учиться","Как этим пользоваться", `
  <section class="hero"><h2>Как учиться, чтобы не бросить на третьей теме</h2>
  <p class="lead">Химия с нуля ломается не на атоме. Она ломается на ощущении «я тупая, все это уже знают». Это ощущение врёт. Взрослый мозг учит медленнее школьного только если его стыдят. Здесь стыда нет.</p></section>
  <section class="card">
    <h3>Ритуал на одну тему</h3>
    <ol>
      <li>Прочитайте определения вслух один раз. Не заучивайте.</li>
      <li>Прочитайте объяснение. Если пример из кухни понятен — тема живая.</li>
      <li>Сделайте задания письменно. Телефон в блокноте не считается: рука включает другую память.</li>
      <li>Закройте ответы, пройдите мини-тест.</li>
      <li>Отметьте тему пройденной, только если можете своими словами сказать, о чём она.</li>
    </ol>
    <div class="def"><b>Критерий понимания.</b> Вы понимаете тему, если можете объяснить её человеку на кухне за минуту, без слов «ну это типа».</div>
    <div class="tip"><b>Совет.</b> Не читайте две темы подряд «чтобы догнать». Одна тема, прогулка, чай — лучше, чем пять тем кашей.</div>
  </section>
  <section class="card">
    <h3>Что не нужно на старте</h3>
    <ul>
      <li>Моль, нормальность и «посчитать выход продукта» — позже, если понадобится.</li>
      <li>Орбитали и квантовые числа. Это красиво, но не фундамент для быта.</li>
      <li>Заучивание всей таблицы. Нужны первые 20 элементов и ещё несколько знакомых.</li>
    </ul>
  </section>
`);

page("m1-1","1.1 Что такое химия","Модуль 1 · Что такое химия", `
  <section class="hero">

  <section class="card">
    <h3>Определения</h3>
    <div class="def"><b>Химия</b> — наука о веществах, их составе, строении, свойствах и превращениях.</div>
    <div class="def"><b>Вещество</b> — то, из чего состоит тело. Сахар, вода, кислород, железо — вещества. Чашка — тело, сделанное из вещества.</div>
    <div class="def"><b>Свойство</b> — признак, по которому вещество узнают или применяют: цвет, запах, температура плавления, горит / не горит, растворяется / нет.</div>

    <p>Мир кажется сделанным из «вещей»: стол, чай, волосы, воздух. Химия снимает с вещи верхний слой и спрашивает: а из какого вещества она собрана? Стол — из целлюлозы и лигнина дерева, плюс лак. Чай — раствор множества веществ в воде. Воздух — смесь газов, в основном азота и кислорода.</p>
    <p>Вторая половина химии — превращения. Дрова становятся углем, углекислым газом и золой. Молоко киснет. Яблоко темнеет на срезе. Это не «магия порчи», это вещества, которые встретились с кислородом, кислотами, ферментами.</p>
    <div class="ex"><b>Пример.</b> Свеча. Воск и фитиль — вещества. Горение — химическое превращение: воск + кислород → углекислый газ + вода + тепло и свет. Если накрыть стаканом, кислород кончается — реакция останавливается. Это уже химический эксперимент, который все видели в детстве.</div>
    <div class="tip"><b>Совет.</b> Пока не гонитесь за названиями. Учитесь сначала замечать: вот вещество, вот свойство, вот превращение.</div>
  </section>

  </section>

    <p>Левая сторона и центр — металлы. Правый верх — неметаллы. Между ними условная лестница. Гелий, неон, аргон — почти не вступают в реакции, их колонка называется благородными газами.</p>
    <p>Главный бытовой навык: увидев символ, уметь сказать имя и «металл / неметалл / газ». Na — натрий, металл. Cl — хлор, неметалл. Fe — железо, металл. C — углерод, неметалл.</p>
    <div class="ex"><b>Пример.</b> Почему соль NaCl, а не NaCl₂ на старте? Натрий из 1-й группы любит отдавать один электрон. Хлор из 17-й любит принимать один. Один к одному. Позже это назовут валентностью и степенью окисления. Сейчас достаточно «группа подсказывает характер».</div>
  </section>
`, [

page("m3-3","3.3 Связи","Ионная и ковалентная связь", `
  <section class="hero"><div class="eyebrow">модуль 3</div><h2>Отдать электрон или пользоваться им вместе</h2></section>
  <section class="card">
    <div class="def"><b>Ионная связь</b> — металл отдал электрон, неметалл принял. Получились ионы с противоположными зарядами, их тянет друг к другу. Образец: NaCl.</div>
    <div class="def"><b>Ковалентная связь</b> — атомы делят пару электронов. Так живут H₂, O₂, H₂O, CO₂, сахар, почти вся органика.</div>

    <p>Вода чуть хитрее: связь ковалентная, но кислород тянет электроны сильнее водорода. Молекула слегка «плюс-минус» с разных концов. Поэтому вода — универсальный растворитель солей и сахара, и поэтому лёд легче воды. Этого факта достаточно, квантовую картину можно не открывать.</p>

  </section>

  <section class="hero"><div class="eyebrow">модуль 4</div><h2>Слева столько же атомов, сколько справа</h2></section>
  <section class="card">

    <div class="def"><b>Закон сохранения массы</b> — атомы не рождаются и не уничтожаются в обычной химии. Они перегруппировываются. Поэтому массы до и после равны, если ничего не улетело из открытого стакана.</div>

    <p><span class="tex">\\mathrm{CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O}</span></p>
    <p>Слева: C=1, H=4, O=4. Справа: C=1, O=2 в углекислом + O=2 в двух водах, H=4. Сошлось.</p>
    <p>Коэффициенты подбирают, индексы не трогают. Индекс — паспорт молекулы. Коэффициент — сколько таких молекул взяли.</p>

    <div class="tip"><b>Навык.</b> На листке расчертите табличку «элемент — слева — справа». Это единственная техника уравнивания, которая нужна на старте.</div>
  </section>

page("m6-1","6.1 Кислоты","Кислоты", `
  <section class="hero"><div class="eyebrow">модуль 6 · кислоты, щёлочи, соли</div>
  <h2>Кислое — не только вкус, но и ионы водорода</h2></section>
  <section class="card">
    <div class="def"><b>Кислота</b> — вещество, которое в воде даёт ионы H⁺ (точнее H₃O⁺, но на старте говорят H⁺).</div>
    <p>Бытовые родственники: уксусная CH₃COOH, лимонная, соляная в желудке HCl, угольная из газировки H₂CO₃ (слабая и нестойкая), аскорбиновая в лимоне.</p>
    <p>Сильные кислоты в чистом виде дома не держат и не смешивают. Столовый уксус 9% — уже рабочий учебный объект: пахнет, щиплет рану, гасит соду, снимает слабый налёт.</p>
    <p>Кислоты узнают по вкусу только в еде. Язык — не лабораторный прибор для чистящих средств.</p>
    <div class="ex"><b>Желудок.</b> HCl помогает ферментам. Изжога — когда кислота поднимается туда, где слизистой мало. Сода «гасит» изжогу коротко, потому что это основание. Постоянно так делать нельзя — это уже не химия курса, это врач.</div>
  </section>
`, [
  {q:"Общий признак кислот в воде", opts:["Дают H⁺","Дают OH⁻","Всегда сладкие","Все металлы"], a:0},

page("m6-2","6.2 Щёлочи","Основания и щёлочи", `
  <section class="hero"><div class="eyebrow">модуль 6</div><h2>Мылкое, скользкое, противоположность кислоте</h2></section>

    <p>Пищевая сода NaHCO₃ — не щёлочь в строгом школьном списке, но раствор у неё слабо щелочной. Хозяйственное мыло — тоже щелочная сторона.</p>
    <p>Щёлочи опаснее, чем кажется по слову «мыло»: они разъедают белки, в том числе глаза и пищевод, тихо. Кислота жжёт сразу, щёлочь может обмануть. Отсюда правило: средства для труб — только по инструкции, никогда к кислоте.</p>

page("m6-3","6.3 pH","Шкала pH", `
  <section class="hero"><div class="eyebrow">модуль 6</div><h2>Одна линейка от лимона до мыла</h2></section>
  <section class="card">
    <div class="def"><b>pH</b> — условная шкала кислотности раствора. 7 — нейтрально (чистая вода около этого). Меньше 7 — кислотно. Больше 7 — щелочно.</div>
    <p>Лимон и уксус — примерно 2–3. Кола — около 2.5. Кофе — около 5. Молоко близко к 6–7. Кровь держит около 7.4 очень строго. Мыло — часто 9–10. Известковая вода и каустик — ещё выше.</p>
    <p>Каждое деление шкалы — не «плюс один чуть-чуть», а roughly десятикратный шаг по концентрации H⁺. Поэтому pH 2 гораздо злее pH 4, чем кажется по цифре.</p>

    <div class="tip"><b>Тело.</b> Кожа слабо кислая. Бесконечное щёлочное мыло сушит не «потому что вытирает удачу», а потому что сбивает кислотную мантию.</div>
  </section>

page("ege-a","№ 1–5",'ЕГЭ № 1–5 · атом, таблица, связь, классы', `
  <section class="hero"><div class="eyebrow">часть 1 · базовый</div>
  <h2>Ряд из пяти элементов и первые фильтры</h2>
  <p class="lead">На Решу ЕГЭ № 1–3 почти всегда сидят на одном ряду. Сначала подпишите каждому номер, группу, период, металл/неметалл, конфигурацию. Потом читайте вопрос.</p></section>

  <section class="card">
    <h3>№ 1. Электронная конфигурация</h3>
    <div class="def"><b>Формат.</b> Дан ряд из 5 элементов. Выбрать те, у которых нужная конфигурация / число валентных / s²p⁴ и т.п. Ответ — цифры в любом порядке или как просят в условии.</div>
    <p><b>Метод.</b> Номер элемента = число электронов. Последний уровень: номер периода. Валентные у главных подгрупп — номер группы (для 1–2 и 13–18 в новой нумерации осторожно: IA = 1 валентный, VIIA = 7).</p>
    <div class="ex"><b>Пример.</b> Ряд: 1) F  2) Mg  3) Br  4) Zn  5) N. Какие имеют на внешнем уровне 7 электронов?<br>
    F: 2s²2p⁵ → 7. Br: 4s²4p⁵ → 7. Zn: 3d¹⁰4s² → 2. Mg: 3s². N: 2s²2p³ → 5.<br>
    Ответ: 13</div>
  </section>

  <section class="card">
    <h3>№ 2. Закономерности таблицы</h3>
    <div class="def"><b>Формат.</b> Из того же ряда выбрать элемент с наибольшим радиусом / самой сильной неметалличностью / высшим оксидом кислотным и т.д.</div>
    <p><b>Метод.</b> По периоду слева направо радиус падает, ЭО растёт. По группе сверху вниз радиус растёт, ЭО падает. Металличность — левый низ, неметалличность — правый верх (без благородных).</p>
    <div class="ex"><b>Пример.</b> Тот же ряд F, Mg, Br, Zn, N. Наименьший атомный радиус?<br>
    Самый правый и верхний из маленьких — F (период 2, группа VII).<br>
    Ответ: 1</div>
  </section>

  <section class="card">
    <h3>№ 3. ЭО, валентность, степень окисления</h3>
    <div class="def"><b>Формат.</b> Выбрать элемент с максимальной ЭО / способный к СО +7 / валентность IV в высшем оксиде.</div>
    <p><b>Метод.</b> Высшая СО неметалла главной подгруппы часто равна номеру группы. Низшая для неметаллов: номер группы − 8 (Cl: +7 и −1). ЭО: F &gt; O &gt; N &gt; Cl &gt; Br.</p>
    <div class="ex"><b>Пример.</b> Ряд: Cl, Na, S, Fe, O. Элемент с высшей СО +6 в высшем оксиде — сера (SO₃). Железо тоже бывает +6, но «высший оксид по группе» в этом задании обычно про главную подгруппу.<br>
    Ответ про S: 3</div>
  </section>

  <section class="card">
    <h3>№ 4. Связь и решётка</h3>
    <div class="def"><b>Формат.</b> Два вещества с одинаковым типом решётки / только молекулярные / только ионные.</div>
    <p><b>Памятка.</b> Ионная — соль, щёлочь, оксид типичного металла. Металлическая — металл, сплав. Атомная — алмаз, Si, SiO₂, графит (особый случай). Молекулярная — газы, лёд, I₂, CO₂, сахар, большинство органики.</p>
    <div class="ex"><b>Пример.</b> Выберите два с молекулярной решёткой: 1) NaCl 2) CO₂ 3) Fe 4) I₂ 5) CaO → 24</div>
  </section>

  <section class="card">
    <h3>№ 5. Классы неорганики</h3>
    <div class="def"><b>Формат.</b> Какие из списка — средние соли / кислые соли / амфотерные оксиды / основания.</div>
    <p><b>Памятка.</b> Основный оксид — металл (Na₂O, CaO). Кислотный — неметалл (SO₃, CO₂, P₂O₅). Амфотерный — ZnO, Al₂O₃, Cr₂O₃, BeO. Кислая соль — NaHCO₃, Ca(H₂PO₄)₂. Средняя — Na₂CO₃. Основание — NaOH, Cu(OH)₂. Амфотерный гидроксид — Al(OH)₃, Zn(OH)₂.</p>
    <div class="ex"><b>Пример.</b> Амфотерные оксиды: 1) Na₂O 2) ZnO 3) SO₂ 4) Al₂O₃ 5) CO → 24</div>
  </section>
`, [{q:'Ряд: O, Ca, S, Ne, F. У каких на внешнем уровне 6 электронов?', input:true, a:'13', why:'O: 2s²2p⁴. S: 3s²3p⁴. F имеет 7, Ca — 2, Ne — 8. На бланке 13 или 31.'},{q:'Из ряда F, Na, Cl, K, O наименьшая электроотрицательность у', opts:['F','Na','Cl','K'], a:3, why:'Калий — левый низ среди названных, самый металлический.'},{q:'Два вещества с ионной решёткой: 1) H₂O  2) KBr  3) алмаз  4) CaO  5) CO₂. Ответ-цифры', input:true, a:'24', why:'KBr и CaO — ионные. Вода и CO₂ молекулярные, алмаз атомный.'},{q:'NaHSO₄ — это', opts:['средняя соль','кислая соль','основание','кислотный оксид'], a:1, why:'Остался атом водорода кислоты — кислая соль.'}]);

  <section class="card">
    <h3>№ 6. Ионный обмен и качественные реакции</h3>
    <div class="def"><b>Формат.</b> Часто «с чем прореагирует / что даст осадок / качественная на ион». Иногда выбрать все верные пары.</div>
    <p><b>Сетка качественных.</b> Cl⁻ + Ag⁺ → белый AgCl (растворяется в NH₃). SO₄²⁻ + Ba²⁺ → белый BaSO₄. CO₃²⁻ + кислота → газ CO₂. Cu²⁺ — синий раствор. Fe³⁺ + SCN⁻ → кроваво-красный. Al³⁺ / Zn²⁺ амфотерны: осадок растворяется и в кислоте, и в щёлочи.</p>
    <div class="ex"><b>Пример.</b> С чем из списка реагирует раствор HCl с видимым эффектом: 1) AgNO₃ 2) NaNO₃ 3) Na₂CO₃ 4) K₂SO₄ 5) CuO<br>
    AgNO₃ → осадок AgCl. Na₂CO₃ → газ. CuO → растворяется, соль меди. NaNO₃ и K₂SO₄ — нет обмена с эффектом.<br>
    Часто ждут 135</div>
  </section>

  <section class="card">
    <h3>№ 7–8. Соответствие «вещество — реагент / продукт»</h3>
    <div class="def"><b>Формат.</b> Три вещества слева, пять реагентов справа. К каждому слева — одна цифра справа. Ответ из трёх цифр в порядке строк.</div>
    <p><b>Метод.</b> Вычеркните невозможное. Амфотерный гидроксид берёт и кислоту, и щёлочь. Благородные газы не реагируют. Конц. HNO₃ и Al на холоде пассивируются. Cu не вытесняет H₂ из кислот-неокислителей.</p>
    <div class="ex"><b>Пример.</b> A) ZnO  B) CaO  C) SO₃<br>
    1) NaOH (р-р)  2) HCl  3) оба  4) ни тот ни другой<br>
    ZnO амфотерный → оба. CaO основный → HCl. SO₃ кислотный → NaOH (и воду, не HCl как основание).<br>
    Пишите три цифры по строкам.</div>
  </section>

  <section class="card">
    <h3>№ 9. Генетическая связь неорганики</h3>
    <div class="def"><b>Формат.</b> Схема X → Y → Z. Подобрать вещества или реагенты.</div>
    <p><b>Классические цепочки.</b> Металл → оксид → гидроксид → соль. Неметалл → оксид → кислота → соль. Al: Al → Al₂O₃ → Na[Al(OH)₄] → Al(OH)₃ → AlCl₃.</p>
    <div class="ex"><b>Пример.</b> S → SO₂ → SO₃ → H₂SO₄ → Na₂SO₄. Реагенты: O₂ (сжигание), O₂ / V₂O₅ / t, H₂O, NaOH. Это эталон «сера до соли».</div>
  </section>
`, [{q:'Качественная реакция на сульфат-ион — реагент', opts:['AgNO₃','BaCl₂','NaOH','лакмус'], a:1, why:'Ba²⁺ + SO₄²⁻ даёт белый осадок BaSO₄, нерастворимый в кислотах.'},{q:'С избытком NaOH прореагирует осадок', opts:['Ca(OH)₂','Al(OH)₃','BaSO₄','AgCl'], a:1, why:'Al(OH)₃ амфотерный, растворяется в щёлочи. Гашёная известь — нет.'},{q:'Медь растворяется в', opts:['разб. HCl','разб. H₂SO₄','конц. HNO₃','воде'], a:2, why:'Cu ниже водорода. Нужна кислота-окислитель: HNO₃ или конц. H₂SO₄ при нагревании.'},{q:'Цепочка Cu → CuO → CuSO₄. Второй реагент', opts:['H₂','H₂SO₄','NaOH','CO₂'], a:1, why:'Основный оксид меди + серная кислота → сульфат + вода.'}]);

page("ege-c","№ 10–16",'ЕГЭ № 10–16 · органика', `
  <section class="hero"><div class="eyebrow">часть 1 · органика</div>
  <h2>Имена, изомеры, свойства, цепочки</h2></section>

  <section class="card">
    <h3>№ 10. Классификация и номенклатура</h3>
    <p>Узнать класс по формуле: C₂H₅OH — спирт, CH₃CHO — альдегид, CH₃COOH — кислота, CH₃COOCH₃ — сложный эфир, C₆H₅OH — фенол, C₂H₅NH₂ — амин, C₆H₆ — арен, C₂H₄ — алкен.</p>
    <div class="ex"><b>Пример.</b> Какие относятся к карбоновым кислотам: 1) HCOOH  2) CH₃CHO  3) C₆H₅COOH  4) CH₃OCH₃  5) CH₃COCH₃ → 13</div>
  </section>

  <section class="card">
    <h3>№ 11. Бутлеров: гибридизация, изомерия, гомологи</h3>
    <p>sp³ — 4 одиночные (алкан, спирт по C–OH углероду). sp² — двойная (алкен, карбонил, бензол). sp — тройная или =C= (алкин, CO₂). Гомологи — одна функционалка, разница CH₂. Изомеры — одна молекулярная формула, разный скелет или группа.</p>
    <div class="ex"><b>Пример.</b> C₄H₁₀: бутан и метилпропан — изомеры. C₂H₅OH и CH₃OCH₃ — тоже изомеры (спирт и эфир). Этанол и пропанол — гомологи.</div>
  </section>

  <section class="card">
    <h3>№ 12–13. Свойства: выбор «что прореагирует»</h3>
    <p>Алкен / алкин / арен (бензол в спец. условиях) — Br₂, KMnO₄. Спирт — Na, HBr, CuO / t (до альдегида). Фенол — Br₂ (вода) белый осадок, NaOH. Альдегид — Ag₂O / NH₃ (серебряное зеркало), Cu(OH)₂ при нагревании. Кислота — NaHCO₃ (газ), спирт (этерификация). Амин — кислота (соль). Белок — биурет (Cu(OH)₂ фиолетовый), ксантопротеин (HNO₃ жёлтый).</p>
  </section>

  <section class="card">
    <h3>№ 14–15. Соответствие реакций органики</h3>
    <p>Три вещества — пять реагентов. Смотрите механизм: Марковников (HBr к алкену несимметричному), гидрирование, гидратация алкена → спирт, окисление первичного спирта → альдегид → кислота.</p>
  </section>

  <section class="card">
    <h3>№ 16. Генетическая связь органики</h3>
    <p>Эталон: CH₄ --Cl₂/hν→ CH₃Cl --aq. KOH→ CH₃OH --CuO/t→ HCHO --[O]→ HCOOH.<br>
    Или: C₂H₄ --H₂O/H⁺→ C₂H₅OH --H₂SO₄/t→ C₂H₄ обратно / этен.</p>
  </section>
`, [{q:'CH₃–COO–C₂H₅ — это', opts:['карбоновая кислота','сложный эфир','простой эфир','кетон'], a:1, why:'Фрагмент COO между углеродами — сложный эфир (этилацетат).'},{q:'Гомолог этана —', opts:['этен','этилен','пропан','этанол'], a:2, why:'Гомолог алкана — следующий алкан, +CH₂. Пропан C₃H₈.'},{q:'Серебряное зеркало даёт', opts:['этанол','ацетон','этаналь','этан'], a:2, why:'Альдегид (и муравьиная кислота / формиаты) восстанавливает аммиачный раствор серебра.'},{q:'Белый осадок с бромной водой при комнатной — характерно для', opts:['этана','фенола','ацетона','метана'], a:1, why:'Фенол даёт 2,4,6-трибромфенол — белый осадок. Алкен обесцвечивает бром, но не этот «белый осадок» как визитка.'},{q:'C₂H₅OH и CH₃OCH₃ — это', opts:['гомологи','изомеры','одно вещество','разные классы без связи формул'], a:1, why:'Одинаковая молекулярная C₂H₆O, разное строение: спирт и простой эфир.'}]);

page("ege-d","№ 17–22",'ЕГЭ № 17–22 · реакции, скорость, ОВР, электролиз, гидролиз, равновесие', `
  <section class="hero"><div class="eyebrow">часть 1 · процессы</div>
  <h2>Не «что за вещество», а «что с ним происходит»</h2></section>

  <section class="card">
    <h3>№ 17. Классификация реакций</h3>
    <p>Соединение / разложение / замещение / обмен. ОВР или нет. Экзо / эндо. Гомоген / гетероген. Каталитическая. Обратимая.</p>
    <div class="ex">2H₂ + O₂ → 2H₂O — соединение, ОВР, экзо, горение. CaCO₃ → CaO + CO₂ — разложение, не ОВР (все СО на месте), эндо.</div>
  </section>

  <section class="card">
    <h3>№ 18. Скорость</h3>
    <p>Ускоряют: температура, концентрация растворённых / газов, поверхность твёрдого, катализатор. Давление влияет, только если есть газы. Катализатор Eₐ снижает, равновесие не смещает.</p>
    <div class="ex">C(тв) + O₂(г) → CO₂. Скорость вырастет: нагреть, взять уголь порошком, повысить p(O₂). Добавка N₂ при постоянном общем давлении кислород разбавит — скорость упадёт.</div>
  </section>

  <section class="card">
    <h3>№ 19. Окислитель и восстановитель</h3>
    <p>Окислитель принимает электроны, его СО падает. Восстановитель отдаёт, его СО растёт. Типичные окислители: KMnO₄, K₂Cr₂O₇, HNO₃, O₂, Cl₂. Восстановители: металлы, H₂, C, CO, сульфиты, I⁻.</p>
  </section>

  <section class="card">
    <h3>№ 20. Электролиз</h3>
    <p><b>Расплав соли.</b> Катод: металл. Анод: неметалл (Cl₂ из хлорида).<br>
    <b>Раствор.</b> Катод: если металл левее Al в ряду напряжений — обычно H₂; правее (Cu, Ag) — металл. Анод инертный: бескислородная кислота/соль → неметалл; кислородная соль / сульфат / нитрат / щёлочь → O₂.</p>
    <div class="ex">Раствор CuCl₂, инертные электроды: катод Cu, анод Cl₂. Раствор Na₂SO₄: катод H₂, анод O₂.</div>
  </section>

  <section class="card">
    <h3>№ 21. Гидролиз и pH соли</h3>
    <p>Соль сильной кислоты и сильного основания (NaCl, KNO₃, Na₂SO₄) — нейтрально, гидролиза нет.<br>
    Сильное основание + слабая кислота (Na₂CO₃, CH₃COONa) — щёлочь, pH &gt; 7.<br>
    Слабое основание + сильная кислота (NH₄Cl, ZnSO₄, AlCl₃) — кислота, pH &lt; 7.<br>
    Обе слабые — смотреть, кто слабее; часто слабокислотно.</p>
  </section>

  <section class="card">
    <h3>№ 22. Равновесие (Ле Шателье)</h3>
    <p>Нагрели — в сторону эндо. Сжали (↑p) — в сторону меньшего числа молей газа. Добавили реагент — вперёд. Катализатор — только время, положение равновесия то же.</p>
    <div class="ex">N₂ + 3H₂ ⇌ 2NH₃, ΔH &lt; 0. Выход аммиака растёт: ↓T, ↑p, убирать NH₃. Катализатор выход не поднимает, только скорость.</div>
  </section>
`, [{q:'Нейтрализация HCl + NaOH — это в первую очередь', opts:['соединение','обмен','разложение','замещение'], a:1, why:'Два сложных меняются частями: соль + вода.'},{q:'Скорость горения угля вырастет, если', opts:['взять один большой кусок вместо порошка','охладить','увеличить поверхность угля','добавить катализатор равновесия воды'], a:2, why:''},{q:'При электролизе раствора CuSO₄ на катоде', opts:['H₂','O₂','Cu','S'], a:2, why:'Медь правее водорода — восстанавливается сама.'},{q:'Раствор Na₂CO₃', opts:['кислый','нейтральный','щелочной','не электролит'], a:2, why:'Гидролиз по аниону слабой угольной кислоты.'},{q:'Для N₂ + 3H₂ ⇌ 2NH₃ + Q сжатие смещает равновесие', opts:['влево','вправо','никак, газов нет','только ускоряет катализатор'], a:1, why:'Слева 4 моль газа, справа 2. Давление гонит вправо.'}]);

page("ege-e","№ 23–28",'ЕГЭ № 23–28 · расчёты кратко', `
  <section class="hero"><div class="eyebrow">часть 1 · числа</div>
  <h2>Один ответ-число, без лишних нулей</h2>
  <p class="lead">Запятая в бланке — как в условии. Обычно ждут целое или одну-две цифры после запятой. Моль считайте через M и Vₘ = 22,4 л/моль (н.у.).</p></section>

  <section class="card">
    <h3>№ 23. Расчёт по уравнению</h3>
    <p>n = m/M = V/22,4 = N/Nₐ. Коэффициенты — пропорция молей.</p>
    <div class="ex"><b>Пример.</b> 2H₂ + O₂ → 2H₂O. Какой объём O₂ нужен на 8 г H₂?<br>
    n(H₂)=8/2=4 моль. По уравнению O₂ в два раза меньше → 2 моль → 44,8 л.<br>
    Ответ: 44,8</div>
  </section>

  <section class="card">
    <h3>№ 24. Тепловой эффект</h3>
    <p>Термохимическое уравнение: коэффициент = столько молей, сколько в уравнении. Пропорция к Q.</p>
    <div class="ex">CH₄ + 2O₂ → CO₂ + 2H₂O + 802 кДж. Сколько теплоты при сгорании 8 г метана?<br>
    16 г (1 моль) → 802 кДж, 8 г → 401 кДж.</div>
  </section>

  <section class="card">
    <h3>№ 25. Массовая доля раствора</h3>
    <p>w = m(вещества)/m(раствора). m(раствора)=m(в-ва)+m(воды). Если смешали растворы — сложить массы и сложить массы вещества.</p>
    <div class="ex">20 г соли в 180 г воды. w=20/200=0,1 → 10%.</div>
  </section>

  <section class="card">
    <h3>№ 26. Выход и примеси</h3>
    <p>η = m(практика)/m(теория). Если вещество 80% чистоты, рабочих граммов 0,8m.</p>
  </section>

  <section class="card">
    <h3>№ 27–28. Формула и комбинация</h3>
    <p>По продуктам сгорания: n(C)=n(CO₂), n(H)=2n(H₂O), n(O) из разницы массы. Простейшая формула — деление на меньшее n, молекулярная — через M (из плотности ρ=M/22,4).</p>
  </section>
`, [{q:'Объём (н.у., л) водорода из 65 г цинка по Zn + 2HCl → ZnCl₂ + H₂. M(Zn)=65. Целое число.', input:true, a:'22.4', why:'n(Zn)=1 моль → 1 моль H₂ → 22,4 л. Допустим также 22,4'},{q:'Сколько граммов соли в 200 г 15% раствора? Целое.', input:true, a:'30', why:'0,15×200=30 г.'},{q:'Теория 50 г продукта, получили 40 г. Выход в %', input:true, a:'80', why:'40/50×100=80.'},{q:'При сгорании 1 моль CH₄ по уравнению с Q=802 кДж выделилось теплоты (кДж), целое', input:true, a:'802', why:'Ровно столько, сколько в термохимическом уравнении на 1 моль.'}]);

page("ege-f","№ 29–34",'ЕГЭ № 29–34 · развёрнутый ответ', `
  <section class="hero"><div class="eyebrow">часть 2 · высокий</div>
  <h2>Пишут не цифру — пишут ход</h2>
  <p class="lead">На Решу у этих номеров длинные эталоны. Эксперт ставит баллы по элементам: уравнение есть / коэффициенты верны / расчёт с единицами / формула обоснована. Ниже — скелет, как не потерять баллы.</p></section>

  <section class="card">
    <h3>№ 29. ОВР с балансом</h3>
    <p>1) Расставить СО. 2) Электронный баланс. 3) Сшить коэффициенты. 4) Дописать H⁺ / OH⁻ / H₂O под среду (кислота / щёлочь / нейтральная — как в условии).</p>
    <div class="ex"><b>Эталон.</b> KMnO₄ + Na₂SO₃ + H₂SO₄ → MnSO₄ + Na₂SO₄ + K₂SO₄ + H₂O<br>
    Mn⁺⁷ + 5e → Mn⁺²<br>
    S⁺⁴ − 2e → S⁺⁶<br>
    2 и 5, НОК 10: 2Mn, 5S. Дальше добирают K, Na, SO₄, воду.<br>
    2KMnO₄ + 5Na₂SO₃ + 3H₂SO₄ → 2MnSO₄ + 5Na₂SO₄ + K₂SO₄ + 3H₂O</div>
  </section>

  <section class="card">
    <h3>№ 30. Четыре неорганических уравнения</h3>
    <p>Дана схема или «вещество X реагирует с A, B, C, D». Нужны 4 уравнения. Часто X — Al, Zn, Fe, Si, P, Cl₂, HNO₃. Пишите реально возможные, не «всё со всем».</p>
    <div class="ex">Алюминий: 2Al + 6HCl → 2AlCl₃ + 3H₂; 2Al + 2NaOH + 6H₂O → 2Na[Al(OH)₄] + 3H₂; 4Al + 3O₂ → 2Al₂O₃; 2Al + Fe₂O₃ → Al₂O₃ + 2Fe (алюмотермия).</div>
  </section>

  <section class="card">
    <h3>№ 31. Органические превращения</h3>
    <p>Цепочка из 3–4 стрелок. На каждой стрелке реагент. Пишите структурные формулы, не только молекулярные — так эксперт не придерётся к изомеру.</p>
    <div class="ex">CH₂=CH₂ --HBr→ CH₃–CH₂Br --aq.KOH→ CH₃–CH₂OH --CuO, t→ CH₃CHO --Ag₂O, NH₃→ CH₃COONH₄ (или кислота, как просят).</div>
  </section>

  <section class="card">
    <h3>№ 32. Расчёт развёрнуто</h3>
    <p>Обязательно: дано / найти, уравнения, n = m/M, пропорция, единицы, ответ с размерностью. Без единиц часто снимают элемент.</p>
  </section>

  <section class="card">
    <h3>№ 33. Смесь / избыток / выход</h3>
    <p>Сначала «кто в недостатке». Потом теория. Потом η или доля примеси. Не смешивайте массу смеси и массу чистого.</p>
  </section>

  <section class="card">
    <h3>№ 34. Формула органики</h3>
    <p>Шаги, которые ждут всегда: 1) n продуктов → n C, H, O, N 2) простейшая 3) M из плотности или массовой доли → молекулярная 4) структура по химическим свойствам из условия 5) уравнение реакции из пункта 3 условия.</p>
    <div class="ex">Сгорело 6,0 г вещества → 8,96 л CO₂ и 7,2 г H₂O. M по воздуху 2,07 (Mвозд≈29) → M≈60. n(CO₂)=8,96/22,4=0,4; n(C)=0,4; n(H₂O)=7,2/18=0,4; n(H)=0,8. m(C+H)=4,8+0,8=5,6; m(O)=0,4 г; n(O)=0,025. На 6 г это неудобно масштабировать — считайте на 1 моль через M=60 и доли. Классика часто выводит C₂H₄O₂ — уксусная кислота. Структура CH₃COOH, реакция с NaHCO₃ даёт CO₂.</div>
    <div class="tip"><b>Совет на бланк.</b> Даже если структура не уверенная, расчёт формулы доведите до конца — за него отдельные баллы.</div>
  </section>
`, [{q:'В кислой среде MnO₄⁻ обычно переходит в', opts:['MnO₄²⁻','MnO₂','Mn²⁺','Mn'], a:2, why:'Кислая — до Mn²⁺, нейтральная/слабощелочная — MnO₂, сильнощелочная — MnO₄²⁻.'},{q:'На катоде при электролизе расплава NaCl выделяется', opts:['Cl₂','O₂','Na','H₂'], a:2, why:'В расплаве нет воды — натрий восстанавливается сам. H₂ был бы в растворе.'},{q:'Первый шаг № 34 после продуктов сгорания', opts:['сразу структура','найти n(C), n(H), n(O)','написать механизм Марковникова','уравнять ОВР перманганата'], a:1, why:''},{q:'В развёрнутом расчёте эксперт чаще всего хочет увидеть', opts:['только финальное число','ход с единицами и уравнением','рисунок таблицы Менделеева','ответ латиницей'], a:1, why:''}]);

page("ege-drill","Тренажёр ЕГЭ",'Смешанная проверка формата', `
  <section class="hero"><h2>Короткая смесь разных номеров</h2>
  <p class="lead">Как на Решу в режиме «вариант»: типы вперемешку. Не экзамен, проверка «узнаю ли формат».</p></section>
`, [{q:'№1-стиль. Ряд N, P, O, S, F. Внешний уровень s²p⁴ у', opts:['только O','O и S','N и P','F'], a:1, why:'s²p⁴ — группа VIA: кислород и сера.'},{q:'№4-стиль. Атомную решётку имеет', opts:['лёд','NaCl','кремний','натрий'], a:2, why:''},{q:'№21-стиль. pH раствора NH₄Cl', opts:['> 7','= 7','< 7','14'], a:2, why:'Соль слабого основания и сильной кислоты.'},{q:'№25-стиль. 10 г вещества в 90 г воды. w в %', input:true, a:'10', why:'10/100×100=10%.'},{q:'№11-стиль. sp-гибридизация у углерода в', opts:['метане','этене','этине','этаноле по CH₃'], a:2, why:'Тройная связь C≡C — sp.'},{q:'№19-стиль. В реакции 2Mg + O₂ → 2MgO окислитель', opts:['Mg','O₂','MgO','нет окислителя'], a:1, why:''},{q:'№20-стиль. Электролиз раствора AgNO₃, инертный анод: на катоде', opts:['H₂','Ag','O₂','N₂'], a:1, why:''},{q:'№18-стиль. Катализатор равновесие', opts:['смещает вправо','смещает влево','не смещает','уничтожает продукты'], a:2, why:''}]);

function renderKatex(root){
  if (!window.renderMathInElement) return;
  renderMathInElement(root, {
    delimiters: [
      {left:"$$", right:"$$", display:true},
      {left:"\\(", right:"\\)", display:false}
    ],
    throwOnError:false
  });
  root.querySelectorAll(".tex").forEach(el => {
    try { katex.render(el.textContent, el, {throwOnError:false}); } catch(e){}
  });
}

function navHtml(){
  const groups = [
    ["Курс", ["home","how"]],
    ["Модуль 1", ["m1-1","m1-2","m1-3","m1-4","m1-5","m1-t"]],
    ["Модуль 2", ["m2-1","m2-2","m2-3","m2-4","m2-5","m2-t"]],
    ["Модуль 3", ["m3-1","m3-2","m3-3","m3-4","m3-t"]],
    ["Модуль 4", ["m4-1","m4-2","m4-3","m4-4","m4-t"]],
    ["Модуль 5", ["m5-1","m5-2","m5-3","m5-t"]],
    ["Модуль 6", ["m6-1","m6-2","m6-3","m6-4","m6-t"]],
    ["Модуль 7", ["m7-1","m7-2","m7-3","m7-4","m7-t"]],
    ["ЕГЭ · Решу-формат", ["ege","ege-a","ege-b","ege-c","ege-d","ege-e","ege-f","ege-drill"]],
    ["Справочники", ["table","gloss","tasks","progress"]]
  ];
  let h = `<div class="brand"><div class="eyebrow">Женя</div><h1>Химия с нуля</h1><p>каркас, не экзамен</p></div>`;
  for (const [name, ids] of groups){
    h += `<div class="nav-sec">${name}</div>`;
    for (const id of ids){
      const p = PAGES.find(x => x.id === id);
      const done = state.done[id] ? " done" : "";
      h += `<button class="nav-btn${done}" data-go="${id}"><i class="dot"></i>${p.nav}</button>`;
    }
  }
  return h;
}

function lessonExtras(p){
  let h = "";
  if (p.quiz){
    h += `<section class="card"><h3>Мини-проверка</h3>`;
    p.quiz.forEach((item, i) => {
      h += `<div class="q" data-qi="${i}"><div class="q-head">${i+1}. ${item.q}</div>`;
      if (item.input){
        h += `<p><input class="ans-in" data-in="${i}" placeholder="ответ как на бланке" autocomplete="off"></p></div>`;
      } else {
        h += `<div class="options">`;
        item.opts.forEach((o, j) => {
          h += `<label class="opt"><input type="radio" name="${p.id}-q${i}" value="${j}"> ${o}</label>`;
        });
        h += `</div></div>`;
      }
    });
    h += `<p><button class="btn" type="button" data-check>проверить</button> <span class="score" data-score></span></p></section>`;
  }
  h += `<section class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn good" type="button" data-mark>${state.done[p.id] ? "тема отмечена" : "отметить тему пройденной"}</button>
    <span class="done-mark" data-done-label>${state.done[p.id] ? "есть в прогрессе" : ""}</span>
    <span style="flex:1"></span>
    <button class="btn sec" type="button" data-prev>назад</button>
    <button class="btn sec" type="button" data-next>дальше</button>
  </section>`;
  return h;
}

function renderProgressBits(){
  const learn = PAGES.filter(p => !["home","how","table","gloss","tasks","progress","ege"].includes(p.id));
  const n = learn.filter(p => state.done[p.id]).length;
  const pct = Math.round(n / learn.length * 100);
  document.querySelectorAll("#home-bar,#prog-bar-2").forEach(el => { if(el) el.style.width = pct + "%"; });
  const t = `${n} из ${learn.length} учебных тем · ${pct}%`;
  const a = document.getElementById("home-prog"); if (a) a.textContent = t;
  const b = document.getElementById("prog-text"); if (b) b.textContent = t;
}

function show(id){
  const idx = PAGES.findIndex(p => p.id === id);
  const p = PAGES[idx];
  if (!p) return;
  location.hash = id;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.go === id));
  const view = document.getElementById("view");
  view.innerHTML = p.html + lessonExtras(p);
  if (id === "table"){
    const box = document.getElementById("ptable");
    box.innerHTML = PTABLE.map(el => `<div class="el ${el.g}" data-z="${el.z}"><span>${el.z}</span><b>${el.s}</b><span>${el.n}</span></div>`).join("");
  }
  if (id === "gloss"){
    document.getElementById("gloss-box").innerHTML = GLOSSARY.map(([k,v]) => `<div class="def"><b>${k}.</b> ${v}</div>`).join("");
  }
  if (id === "progress"){
    const learn = PAGES.filter(x => !["home","how","table","gloss","tasks","progress","ege"].includes(x.id));
    document.getElementById("prog-list").innerHTML = learn.map(x => {
      const ok = state.done[x.id];
      const q = state.quiz[x.id];
      const qtxt = q ? ` · тест ${q.s}/${q.t}` : "";
      return `<p>${ok ? "✓" : "○"} <a href="#${x.id}">${x.title}</a>${qtxt}</p>`;
    }).join("");
  }
  renderProgressBits();
  renderKatex(view);
  document.getElementById("sidebar").classList.remove("open");
  window.scrollTo(0,0);
}

document.getElementById("sidebar").innerHTML = navHtml();

document.body.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go){ show(go.dataset.go); return; }
  if (e.target.id === "menu"){ document.getElementById("sidebar").classList.toggle("open"); return; }
  if (e.target.closest("[data-open]")){ e.target.closest(".task").classList.toggle("open"); return; }
  if (e.target.id === "reset-progress"){
    if (confirm("Сбросить отметки в этом браузере?")){ state.done = {}; state.quiz = {}; save(); document.getElementById("sidebar").innerHTML = navHtml(); show("progress"); }
    return;
  }
  const mark = e.target.closest("[data-mark]");
  if (mark){
    const id = location.hash.slice(1) || "home";
    state.done[id] = true; save();
    mark.textContent = "тема отмечена";
    const lab = document.querySelector("[data-done-label]"); if (lab) lab.textContent = "есть в прогрессе";
    document.getElementById("sidebar").innerHTML = navHtml();
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.go === id));
    renderProgressBits();
    return;
  }
  if (e.target.closest("[data-next]") || e.target.closest("[data-prev]")){
    const id = location.hash.slice(1) || "home";
    const i = PAGES.findIndex(p => p.id === id);
    const n = e.target.closest("[data-next]") ? i+1 : i-1;
    if (PAGES[n]) show(PAGES[n].id);
    return;
  }
  if (e.target.closest("[data-check]")){
    const id = location.hash.slice(1);
    const p = PAGES.find(x => x.id === id);
    if (!p || !p.quiz) return;
    let s = 0;
    p.quiz.forEach((item, i) => {
      const box = document.querySelector(`.q[data-qi="${i}"]`);
      const opts = [...box.querySelectorAll(".opt")];
      opts.forEach(o => o.classList.remove("correct","wrong"));
      if (item.input){
        const raw = (box.querySelector("[data-in]")?.value || "").trim().replace(",", ".").replace(/\s+/g,"");
        const want = String(item.a).replace(",", ".").replace(/\s+/g,"");
        const alt = want.split("").reverse().join("");
        const ok = raw === want || (want.length<=3 && /^\d+$/.test(want) && raw === alt);
        const inp = box.querySelector("[data-in]");
        if (inp){ inp.style.borderColor = ok ? "var(--good)" : "var(--crit)"; }
        if (ok) s++;
      } else {
        const chosen = box.querySelector("input:checked");
        const val = chosen ? Number(chosen.value) : -1;
        if (opts[item.a]) opts[item.a].classList.add("correct");
        if (val === item.a) s++;
        else if (val >= 0 && opts[val]) opts[val].classList.add("wrong");
      }
      if (item.why){
        let r = box.querySelector(".reveal");
        if (!r){ r = document.createElement("div"); r.className = "reveal"; box.appendChild(r); }
        r.textContent = item.why;
      }
      box.classList.add("checked");
    });
    const t = p.quiz.length;
    document.querySelector("[data-score]").textContent = `${s} из ${t}` + (s/t >= .7 ? " · можно идти" : " · лучше перечитать");
    state.quiz[id] = {s,t}; save();
    return;
  }
  const el = e.target.closest(".el");
  if (el){
    const data = PTABLE.find(x => String(x.z) === el.dataset.z);
    const modal = document.getElementById("modal");
    modal.className = "modal-bg show";
    modal.innerHTML = `<div class="modal"><div class="eyebrow">${data.g === "metal" ? "металл" : data.g === "noble" ? "благородный газ" : "неметалл"}</div>
      <h3 style="margin-top:8px">${data.s} · ${data.n}</h3>
      <p>Номер ${data.z}. Относительная атомная масса ${data.m}.</p>
      <p>${data.note}</p>
      <p><button class="btn" type="button" id="close-m">закрыть</button></p></div>`;
  }
  if (e.target.id === "close-m" || e.target.id === "modal"){ document.getElementById("modal").className = "modal-bg"; }
});

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && PAGES.some(p => p.id === id)) show(id);
});
show((location.hash.slice(1) && PAGES.some(p => p.id === location.hash.slice(1))) ? location.hash.slice(1) : "home");
</script>
